; Supervisor program — Converza, cola de IA (comprobantes de pago)
;
; Install on the server at:  /etc/supervisor/conf.d/converza-ai.conf
; After editing:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status converza-ai:*
;
; Va en su propio archivo, y no dentro de converza-worker.conf, para que
; instalarlo o tocarlo nunca reinicie ni cambie los workers de la cola de
; mensajes. Ver docs/agente-ia.md.
;
; Por qué una cola aparte: leer un comprobante con IA tarda segundos, y
; registrarlo en ispwatch puede tardar más (ispwatch reconecta al cliente en el
; router dentro de la misma petición). En la cola 'default', una ráfaga de
; comprobantes a principio de mes dejaría esperando la ingesta y los envíos.
;
; Sin este programa nada se lee: los flujos esperan 5 min y mandan el
; comprobante a revisión humana. Con AI_ENABLED=false (por defecto) ni siquiera
; se encola nada.
;
; Un solo proceso: cada lectura es una llamada HTTP, no CPU, y el droplet es de
; 961 MB (ver la cuenta de memoria en converza-worker.conf). Con este, son tres
; workers en total (~300 MB en el pico, antes del reciclado horario).

[program:converza-ai]
process_name=%(program_name)s_%(process_num)02d

; --timeout=150 → por encima del $timeout de ProcessPaymentReport (140)
; --tries=3     → igual que el job (que trae su propio backoff de 10 s y 30 s)
; --sleep=3     → es una cola tranquila
; --max-time=3600 → reinicio horario, igual que los demás workers
command=php /var/www/converza-crm/artisan queue:work --queue=ai --tries=3 --timeout=150 --sleep=3 --max-time=3600
numprocs=1

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; El mismo usuario que PHP-FPM: lee los medios del disco y escribe en storage.
user=www-data

redirect_stderr=true
stdout_logfile=/var/log/supervisor/converza-ai.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=2

; Deja terminar la lectura o el registro en curso antes del SIGKILL.
stopwaitsecs=160
