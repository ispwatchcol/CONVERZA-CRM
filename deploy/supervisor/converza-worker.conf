; Supervisor program — Converza queue worker
;
; Install on the server at:  /etc/supervisor/conf.d/converza-worker.conf
; After editing:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start converza-worker:*

[program:converza-worker]
process_name=%(program_name)s_%(process_num)02d

; --max-time=3600 → worker restarts every hour to avoid memory leaks
; --tries=3 / --backoff=5 → matches the job-class settings
; --timeout=120 → max 2 min per job (media downloads can be slow)
; --sleep=1 → poll DB queue every 1s when idle
command=php /var/www/converza-crm/artisan queue:work --queue=default --tries=3 --backoff=5 --timeout=120 --sleep=1 --max-time=3600

; 2 parallel workers.
;
; Estuvo en 4, medido el 20/08/2026 con estos números:
;   - Droplet de 1 vCPU y 961 MB. Carga 0.24/0.45/0.44 (≈75 % ocioso).
;   - Cada worker al 0.1 % de CPU: el trabajo real es I/O contra la Graph API.
;   - Volumen: ~142 mensajes/día, pico histórico 525/hora (0.15/s). Cola en 0.
;   - Campañas sin usar todavía (0 creadas), así que no hay carga en ráfagas.
;
; El problema no era CPU sino MEMORIA: cada worker arranca en ~62 MB y crece
; hasta ~98 MB antes del reciclado horario (--max-time=3600). Cuatro workers en
; el pico son ~392 MB, más los pools de PHP-FPM, sobre 961 MB totales. Eso es lo
; que empujó 380 MB a swap.
;
; Con dos, el pico de los workers baja a ~196 MB y el sistema deja de rozar el
; límite. No procesa más lento: a 0.15 mensajes/s sobra con uno.
;
; Cuándo volver a subirlo — por señales, no por sensación:
;   - `Queue::size()` creciendo sin bajar de forma sostenida.
;   - Campañas masivas en uso real (el envío es I/O, ahí sí ayudan más workers
;     aunque el vCPU sea uno solo).
; Antes de pasar de 4, subir el droplet: si no, se vuelve al swap.
numprocs=2

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; IMPORTANT: this must be the same user that runs PHP-FPM / nginx.
; Verify with:  ps aux | grep -E 'fpm|nginx' | grep -v root | head -3
user=www-data

redirect_stderr=true
stdout_logfile=/var/log/supervisor/converza-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

; Give workers time to finish in-flight jobs before SIGKILL
stopwaitsecs=130
