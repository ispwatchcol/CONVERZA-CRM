name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Solo un deploy a la vez. Si llegan 2 pushes seguidos, el 2do espera
# al 1ro en vez de pisarlo a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────────────
      # 1) Build de assets EN EL RUNNER (7 GB RAM, sin riesgo de OOM)
      # ───────────────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci

      - name: Build assets
        run: npm run build

      # ───────────────────────────────────────────────────────────────────
      # 2) Configurar SSH para hablar con el droplet
      # ───────────────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ───────────────────────────────────────────────────────────────────
      # 3) Subir assets ya construidos al droplet vía rsync
      #    --delete limpia archivos viejos (manifest.json apuntando a
      #    hashes que ya no existen → 500). Es el bug que tuvimos.
      # ───────────────────────────────────────────────────────────────────
      - name: Upload built assets to droplet
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/converza-crm/public/build/

      # ───────────────────────────────────────────────────────────────────
      # 4) Pasos server-side (NO npm — los assets ya están subidos)
      #    El git checkout al SHA exacto del trigger asegura que el PHP
      #    code matcheé los assets que acabamos de subir, aunque alguien
      #    haga otro push mientras este deploy corre.
      # ───────────────────────────────────────────────────────────────────
      - name: Run server-side deploy on droplet
        env:
          # El secreto entra por el entorno del runner, no interpolado en el
          # script: así no queda en el YAML renderizado del log.
          DB_PASSWORD_PLANO: ${{ secrets.DB_PASSWORD }}
        run: |
          # Se manda en base64 porque el valor viaja como argumento por SSH. Una
          # contraseña con comillas rompería el entrecomillado; base64 solo
          # produce [A-Za-z0-9+/=], siempre seguro sin comillas.
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD_PLANO" | base64 -w0)

          # ¡OJO CON EL << 'EOF' ENTRECOMILLADO!
          #
          # Las comillas alrededor de EOF hacen que el shell del RUNNER no
          # expanda NADA del cuerpo: ni $variables, ni $(...), ni backticks.
          # El script llega literal al servidor y se ejecuta allá.
          #
          # Sin las comillas, un simple backtick dentro de un COMENTARIO se
          # convierte en sustitución de comandos en el runner. Pasó el
          # 21/08/2026: dos comentarios con backticks se emparejaron entre sí,
          # el runner intentó ejecutar quince líneas de comentario y el deploy
          # murió a mitad, dejando el código nuevo en disco sin config:cache ni
          # reinicio de workers.
          #
          # Consecuencias de que esté entrecomillado:
          #   - Escribí $VARIABLE normal, sin \$. Todo se evalúa en el servidor.
          #   - Los valores del runner NO llegan por interpolación: se pasan
          #     como argumentos posicionales a `bash -s --`.
          #   - Las expresiones de GitHub Actions (dólar + dos llaves) SÍ
          #     funcionan: se sustituyen antes de que el shell vea el script.
          #
          # ⚠️ NUNCA escribas una expresión de Actions vacía en este archivo, ni
          # siquiera dentro de un comentario. GitHub sustituye TODO el bloque
          # `run:` antes de que exista un shell, así que un `#` no protege nada:
          # una expresión vacía no compila, el workflow ni siquiera arranca y
          # falla sin agendar un solo job. Eso deja el repo SIN despliegue y sin
          # logs que mirar. Pasó exactamente así entre el 21/08 y el 02/09/2026
          # —doce días, tres merges sin desplegar— por un comentario que
          # explicaba esta misma sintaxis. Si necesitás nombrarla, describila con
          # palabras como acá arriba.
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            bash -s -- "$DB_PASSWORD_B64" << 'EOF'
            set -e

            # Argumento 1: la contraseña en base64 (o vacío si no hay secreto).
            PASS_B64="$1"

            cd /var/www/converza-crm

            # NOTA: los permisos de storage (para que www-data, el usuario de PHP-FPM,
            # pueda escribir storage/app/public) se arreglan UNA SOLA VEZ a mano —ver
            # deploy/DEPLOY.md—. No se hacen aquí porque el usuario de deploy no tiene
            # sudo sin contraseña para chown/chmod, y con setgid los archivos nuevos
            # ya heredan el grupo www-data, así que no hace falta repetirlo cada deploy.

            echo "==> Fetching and resetting to ${{ github.sha }}"
            git fetch origin --prune
            # Descarta cualquier cambio local en archivos trackeados antes del reset.
            # Esto evita el error "would be overwritten by checkout/reset" si alguien
            # editó un archivo manualmente en el servidor.
            git checkout -- .
            # reset --hard (en vez de checkout) hace el deploy determinista: fuerza
            # el árbol al SHA exacto aunque alguien haya editado archivos trackeados
            # en el servidor. NO toca .env, public/build ni medios subidos (están
            # gitignored / sin trackear). No usar 'git clean' aquí: borraría el .env.
            git reset --hard ${{ github.sha }}

            echo "==> Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --no-interaction

            # Propaga la contraseña de Postgres desde GitHub Secrets al .env.
            # Actualiza DB_PASSWORD e ISPWATCH_DB_PASSWORD JUNTAS: olvidar la
            # segunda es exactamente lo que causó la caída del 20/08/2026.
            #
            # Va ANTES de migrate (si la contraseña rotó, migrate fallaría con la
            # vieja) y antes de config:cache (que congelaría el valor viejo).
            #
            # Si el secreto no existe todavía, el script no toca nada y sale con 0.
            echo "==> Syncing secrets into .env"
            # export es un builtin del shell: el valor no aparece en la lista de
            # procesos, a diferencia de un prefijo VAR=valor delante del comando.
            export CONVERZA_DB_PASSWORD="$(printf '%s' "$PASS_B64" | base64 -d)"
            php deploy/sync-secrets.php
            unset CONVERZA_DB_PASSWORD

            echo "==> Running migrations"
            php artisan migrate --force

            echo "==> Clearing and caching"
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache

            # Comprueba que la config recién cacheada realmente funcione: ambas
            # conexiones de BD, Redis y disco. migrate --force de arriba solo
            # ejerce 'pgsql'; la conexión 'ispwatch' no la toca nadie hasta que
            # alguien abre el dashboard —así se nos escapó una contraseña vieja
            # durante casi diez horas el 20/08/2026—.
            #
            # NO se aborta aquí: el código ya está en disco, así que cortar a
            # media asta dejaría los workers con código viejo y PHP-FPM con el
            # nuevo. Se termina el deploy en estado consistente y se falla al
            # final, que es lo que pone el workflow en rojo y avisa.
            echo "==> Verifying configuration"
            VERIFY_OK=1
            php artisan deploy:verify || VERIFY_OK=0

            echo "==> Reloading PHP-FPM"
            sudo systemctl reload php8.2-fpm

            echo "==> Restarting queue workers (Supervisor)"
            sudo supervisorctl restart converza-worker:* \
              || echo "  WARNING: workers not configured yet — see deploy/DEPLOY.md"

            echo "==> Deploy complete: $(git log -1 --format='%h %s')"

            if [ "$VERIFY_OK" -ne 1 ]; then
              echo ""
              echo "!! El código quedó desplegado, pero alguna dependencia NO responde."
              echo "!! Revisá el .env del servidor y corré 'php artisan config:cache'."
              echo "!! Detalle: la salida de 'deploy:verify' más arriba."
              exit 1
            fi
          EOF
